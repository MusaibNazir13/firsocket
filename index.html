<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Smart Socket</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #191970, #7b2cbf);
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
    }
    .card {
      width: min(380px, 85vw);
      padding: 24px;
      border-radius: 18px;
      background: #ffffff18;
      border: 1px solid #ffffff40;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }
    button { cursor: pointer; background: #90e0ef; color: #000; font-weight: bold; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    
    .socket { padding: 16px 0; border-bottom: 1px solid #ffffff40; }
    .socket:last-of-type { border-bottom: none; }
    .socket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge.on { background: #4cc9f0; color: #000; box-shadow: 0 0 8px #4cc9f088; }
    .badge.off { background: #444; color: #aaa; }
    
    .timer-text { font-size: 0.9em; color: #caf0f8; margin-top: 6px; font-weight: bold; }
    #status { overflow-wrap: anywhere; margin-bottom: 12px; font-size: 0.9em; }

    /* New Timer UI Styles */
    .timer-controls { background: #00000033; padding: 14px; border-radius: 10px; margin-top: 12px; }
    .timer-controls label { font-size: 14px; color: #caf0f8; }
    .timer-controls input[type="time"] { width: auto; display: inline-block; padding: 8px; background: #fff; color: #000; margin-left: 8px; }
    .btn-row { display: flex; gap: 10px; margin-top: 10px; }
    .cancel-btn { background: #ff4d4d; color: white; }
  </style>
</head>
<body>
  <main class="card">
    <h2>Lubna Jee Luv U 😁</h2></h2>
    <p id="status">Sign in to continue.</p>

    <section id="login">
      <input id="email" type="email" placeholder="Email" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn">Sign in</button>
    </section>

    <section id="controls" hidden>
      <!-- Socket 1 -->
      <div class="socket">
        <div class="socket-header">
          <b>S1 — Ola Charger</b>
          <span id="badge_s1" class="badge off">OFF</span>
        </div>
        <button id="s1Btn" disabled>Loading…</button>
        <div id="timer_s1" class="timer-text">No active timer.</div>
        
        <div class="timer-controls">
          <label>Turn OFF at: <input id="time_s1" type="time"></label>
          <div class="btn-row">
            <button id="setS1TimerBtn">Set Timer</button>
            <button id="cancelS1TimerBtn" class="cancel-btn">Cancel</button>
          </div>
        </div>
      </div>
      
      <!-- Socket 2 -->
      <div class="socket">
        <div class="socket-header">
          <b>S2 — Socket 2</b>
          <span id="badge_s2" class="badge off">OFF</span>
        </div>
        <button id="s2Btn" disabled>Loading…</button>
        <div id="timer_s2" class="timer-text">No active timer.</div>
        
        <div class="timer-controls">
          <label>Turn OFF at: <input id="time_s2" type="time"></label>
          <div class="btn-row">
            <button id="setS2TimerBtn">Set Timer</button>
            <button id="cancelS2TimerBtn" class="cancel-btn">Cancel</button>
          </div>
        </div>
      </div>
      
      <button id="logoutBtn" style="margin-top: 24px; background: #ff4d4d; color: white;">Sign out</button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD_KDCSkQ0A0yyJZfneikhHtqo35NNymDI",
      authDomain: "mysmartsock.firebaseapp.com",
      databaseURL: "https://mysmartsock-default-rtdb.firebaseio.com",
      projectId: "mysmartsock",
      storageBucket: "mysmartsock.firebasestorage.app",
      messagingSenderId: "879716229174",
      appId: "1:879716229174:web:be4bb060223365ce7cb897",
      measurementId: "G-LRER21GLB4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const status = document.getElementById("status");
    const login = document.getElementById("login");
    const controls = document.getElementById("controls");
    const loginBtn = document.getElementById("loginBtn");
    
    const s1Btn = document.getElementById("s1Btn");
    const s2Btn = document.getElementById("s2Btn");
    const badgeS1 = document.getElementById("badge_s1");
    const badgeS2 = document.getElementById("badge_s2");

    let socketStates = { s1: false, s2: false };
    let timerStates = { s1: { active: false, deadline: 0 }, s2: { active: false, deadline: 0 } };

    function showError(error) {
      console.error(error);
      status.textContent = "Error: " + error.message;
    }

    loginBtn.onclick = async () => {
      loginBtn.disabled = true;
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("email").value.trim(), document.getElementById("password").value);
      } catch (error) {
        showError(error);
      } finally {
        loginBtn.disabled = false;
      }
    };

    onAuthStateChanged(auth, user => {
      login.hidden = !!user;
      controls.hidden = !user;

      if (!user) {
        status.textContent = "Sign in to continue.";
        return;
      }

      status.textContent = "Signed in. Monitoring sockets...";

      // Listen for command changes
      onValue(ref(db, "commands"), snapshot => {
        const data = snapshot.val() || {};
        socketStates.s1 = data.s1 === true;
        socketStates.s2 = data.s2 === true;
        render();
      });

      // Listen for timer updates from the ESP8266
      onValue(ref(db, "timer"), snapshot => {
        const data = snapshot.val() || {};
        timerStates.s1 = data.s1 || { active: false, deadline: 0 };
        timerStates.s2 = data.s2 || { active: false, deadline: 0 };
      });
    });

    function render() {
      s1Btn.textContent = socketStates.s1 ? "Turn OFF" : "Turn ON";
      s2Btn.textContent = socketStates.s2 ? "Turn OFF" : "Turn ON";
      s1Btn.disabled = s2Btn.disabled = false;

      badgeS1.textContent = socketStates.s1 ? "ON" : "OFF";
      badgeS1.className = socketStates.s1 ? "badge on" : "badge off";
      
      badgeS2.textContent = socketStates.s2 ? "ON" : "OFF";
      badgeS2.className = socketStates.s2 ? "badge on" : "badge off";
    }

    async function toggleSocket(key, button) {
      button.disabled = true; 
      try {
        const nextState = !socketStates[key];
        await set(ref(db, "commands/" + key), nextState);
        status.textContent = "Command synced.";
      } catch (error) {
        showError(error);
        button.disabled = false;
      }
    }

    s1Btn.onclick = () => toggleSocket("s1", s1Btn);
    s2Btn.onclick = () => toggleSocket("s2", s2Btn);

    // --- New Remote Timer Logic ---
    async function setRemoteTimer(socketKey, inputId) {
      const timeInput = document.getElementById(inputId).value;
      if (!timeInput) {
        status.textContent = 'Please select a time first.';
        return;
      }
      
      // Calculate minutes until target time
      const [h, m] = timeInput.split(':');
      const now = new Date();
      const target = new Date();
      target.setHours(parseInt(h), parseInt(m), 0, 0);
      
      if (target <= now) target.setDate(target.getDate() + 1); // If past, set for tomorrow
      const diffMinutes = Math.floor((target - now) / 60000);
      
      try {
        // Send the minutes duration to Firebase so the ESP can read it
        await set(ref(db, `commands/timer_${socketKey}`), diffMinutes);
        status.textContent = `Set ${socketKey.toUpperCase()} timer to ${timeInput} sent to device.`;
      } catch (error) {
        showError(error);
      }
    }

    async function cancelRemoteTimer(socketKey) {
      try {
        // Sending 0 minutes tells the ESP to cancel the timer
        await set(ref(db, `commands/timer_${socketKey}`), 0);
        status.textContent = `Cancel ${socketKey.toUpperCase()} timer sent to device.`;
      } catch (error) {
        showError(error);
      }
    }

    document.getElementById("setS1TimerBtn").onclick = () => setRemoteTimer("s1", "time_s1");
    document.getElementById("cancelS1TimerBtn").onclick = () => cancelRemoteTimer("s1");
    
    document.getElementById("setS2TimerBtn").onclick = () => setRemoteTimer("s2", "time_s2");
    document.getElementById("cancelS2TimerBtn").onclick = () => cancelRemoteTimer("s2");

    document.getElementById("logoutBtn").onclick = async () => {
      try { await signOut(auth); } catch (error) { showError(error); }
    };

    function formatRemaining(seconds) {
      if (seconds <= 0) return '0s';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return `${h}h ${m}m ${s}s`;
    }

    // Countdown loop
    setInterval(() => {
      if (login.hidden) return; 
      const now = Math.floor(Date.now() / 1000); 

      if (timerStates.s1.active && timerStates.s1.deadline > now) {
        document.getElementById('timer_s1').textContent = '⏱️ Remaining: ' + formatRemaining(timerStates.s1.deadline - now);
      } else {
        document.getElementById('timer_s1').textContent = 'No active timer.';
      }

      if (timerStates.s2.active && timerStates.s2.deadline > now) {
        document.getElementById('timer_s2').textContent = '⏱️ Remaining: ' + formatRemaining(timerStates.s2.deadline - now);
      } else {
        document.getElementById('timer_s2').textContent = 'No active timer.';
      }
    }, 1000);
  </script>
</body>
</html>
